[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "0.2.0"
description = "Interactive media scraper using Telethon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0,<2.0.0",
    "cryptg>=0.4.0",
    "python-dotenv>=1.0.0",
    "customtkinter>=5.2.0",
    "Pillow>=9.1.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0,<1.0.0"
]

[project.scripts]
tg-download = "interactive_downloader:main"
tg-download-web = "web_launcher:main"

[tool.setuptools]
py-modules = [
    "interactive_downloader",
    "telegram_auth",
    "telegram_auth_ui",
    "telegram_transport",
    "queue_state",
    "transfer_scheduler",
    "download_storage",
    "web_launcher"
]

[tool.setuptools.packages.find]
include = ["engine*", "api*"]

[tool.setuptools.package-data]
api = ["static/**"]

[tool.ruff]
line-length = 110
