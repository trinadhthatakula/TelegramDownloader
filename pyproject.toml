[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "0.2.0"
description = "Interactive media scraper using Telethon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0,<2.0.0",
    "cryptg>=0.4.0",
    "python-dotenv>=1.0.0",
    "customtkinter>=5.2.0",
    "Pillow>=9.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
tg-download = "interactive_downloader:main"  # creates a CLI executable on install

[tool.setuptools]
py-modules = ["interactive_downloader", "telegram_auth"]

[tool.ruff]
line-length = 110
